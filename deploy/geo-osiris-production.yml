name: geo-osiris

services:
  geo-api:
    image: ghcr.io/osviel91/geo-osiris-api@sha256:a4236e585c8233b0b92e1148924efc0bac9ad3d7bcde77a326c5b5826b813171
    platform: linux/amd64
    container_name: osiris-geo-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      CORS_ORIGINS: ""
      DATABASE_URL: postgresql+psycopg://osiris:${POSTGRES_PASSWORD}@postgis:5432/osiris
      AEMET_API_KEY: ${AEMET_API_KEY:-}
      GEO_STAGE_TOKEN: ${GEO_STAGE_TOKEN}
      GEO_APPROVE_TOKEN: ${GEO_APPROVE_TOKEN}
      GEO_PUBLISH_TOKEN: ${GEO_PUBLISH_TOKEN}
      GEO_ADMIN_TOKEN: ${GEO_ADMIN_TOKEN}
      APPROVAL_TTL_MINUTES: 60
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - geo-internal
      - geo-osiris_default

  geo-admin:
    image: ghcr.io/osviel91/geo-osiris-admin@sha256:5a905fc388508ce78875ba23d6508cb1db8d4decfb273e8f8a69f47d35b31399
    platform: linux/amd64
    container_name: osiris-geo-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      GEO_API_URL: http://osiris-geo-api:8000
      GEO_ADMIN_TOKEN: ${GEO_ADMIN_TOKEN}
      GEO_APPROVE_TOKEN: ${GEO_APPROVE_TOKEN}
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET}
      AUTHELIA_PORTAL_URL: https://auth.osviel.duckdns.org/
    depends_on:
      - geo-api
    networks:
      - geo-internal
      - geo-osiris_default

  authelia:
    image: authelia/authelia:4.38
    platform: linux/amd64
    container_name: osiris-geo-authelia
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      TZ: UTC
    volumes:
      - /DATA/AppData/geo-osiris-6c/authelia/configuration.yml:/config/configuration.yml:ro
      - /DATA/AppData/geo-osiris-6c/authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-data:/data
    networks:
      - geo-internal

  admin-proxy:
    image: nginx:1.27-alpine
    platform: linux/amd64
    container_name: osiris-geo-admin-proxy
    restart: unless-stopped
    environment:
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET}
    volumes:
      - /DATA/AppData/geo-osiris-6c/proxy/geo-admin.conf.template:/etc/nginx/templates/geo-admin.conf.template:ro
    depends_on:
      - authelia
      - geo-admin
    networks:
      - geo-internal

  postgis:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    platform: linux/amd64
    container_name: osiris-geo-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: osiris
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris -d osiris"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-internal

  geo-publisher:
    image: ghcr.io/osviel91/geo-osiris-publisher@sha256:e128b359da2e309b8b0eb96df10e303c37c9f4da428ec528fd04c67f0865757c
    platform: linux/amd64
    container_name: osiris-geo-publisher
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    environment:
      GEO_API_URL: http://osiris-geo-api:8000
      GEO_PUBLISH_TOKEN: ${GEO_PUBLISH_TOKEN}
    depends_on:
      - geo-api
    networks:
      - geo-internal

volumes:
  postgis-data:
    external: true
    name: geo-osiris-phase3_postgis-data

  authelia-data:
    external: true
    name: geo-osiris_authelia-data

networks:
  geo-internal:
    name: geo-osiris-internal
    internal: true

  geo-osiris_default:
    external: true
    name: geo-osiris_default
