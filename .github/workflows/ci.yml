name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GEO_API_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pre-existing global lint exhausts Node's heap even at 8 GB; restore it once fixed.
      - run: npx eslint src/app/api/local-layers src/lib/local-geo-api.ts src/lib/local-geo-api.test.ts
      - run: npm test
      - run: npm run build
